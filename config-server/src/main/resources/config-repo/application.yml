# Configuracion compartida por TODOS los microservicios clientes del Config Server.
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: "banco-xyz-secreto-compartido-hs256-formativa-backend-semana-6-no-usar-en-produccion"
    expiration-ms: 3600000

# Kafka: broker local (docker-compose.yml). Eventos serializados como JSON.
spring:
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        # Timeouts cortos: si Kafka cae, el publicador falla rapido y el Circuit Breaker actua.
        max.block.ms: 3000
        request.timeout.ms: 2000
        delivery.timeout.ms: 4000
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.bancoxyz.common.events

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,circuitbreakers
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
